routing_rules:
- Every event carries event_id, symbol, event_time, ingest_time, source, schema_version, trace_id, idempotency_key.
- Per-symbol events preserve order through a symbol partition/actor.
- signal.ready bypasses universe batch completion and routes directly to chart/outbox.
