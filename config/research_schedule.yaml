version: 2.1.0
timezone: Asia/Tehran
continuous:
- Bitunix/CoinGecko market streams and health
- X filtered stream for allowlisted official/project/influential accounts when licensed
- official exchange/project announcement streams, webhooks, or feeds
- performance drift and repeated-failure triggers
every_30_seconds:
- runtime heartbeat and top-200 coverage proof; not full research browsing
every_6_hours:
- new projects/listings/upgrades/unlocks and source changes
daily:
- 72-hour catalyst calendar
- universe metadata reconciliation
- paper/live-signal summary
nightly:
- lead-lag incremental event study
- historical analog index
- replay queue
weekly:
- targeted literature sweep
- strategy drift/calibration
- source/API changelog audit
monthly:
- curriculum review
- PBO/robustness audit
- memory compaction
- chaos/recovery drill
event_triggered:
- unusual OB behavior
- signal stop/target
- data/schema drift
- missed/late/duplicate signal
- new pattern hypothesis
idle_budget:
  principle: no critical engine idle; use spare compute for prioritized replay/research without starving live ingestion
  llm: event-triggered only; no infinite loop
  python: bounded worker queue with backpressure and live-priority preemption
