# پل موقت ارسال به تلگرام — فقط dispatch دستی، عمداً بدون کرون.
#
# ارسالِ لحظه‌ای واقعی جای دیگری است: چرخهٔ حمید و اسکن زنده هر دو در همان
# لحظهٔ تولد سیگنال telegram.py را صدا می‌زنند (ضدتکرار signals/sent.json).
# آن مسیر با ثبت دو Secret روشن می‌شود. این ورک‌فلو فقط تا آن موقع پل است —
# توکن از ورودی dispatch (در لاگ چاپ نمی‌شود). کرون ندارد چون بعد از فعال
# شدن Secret، دو فرستندهٔ موازی با دو دفترچهٔ جدا یعنی پیام تکراری.
name: Telegram batch

on:
  workflow_dispatch:
    inputs:
      token:
        description: "توکن ربات (اگر Secret خالی است)"
        required: false
      chat_id:
        description: "شناسهٔ چت (اگر Secret خالی است)"
        required: false

permissions:
  contents: write

concurrency:
  group: telegram-batch
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ابزار چارت و ارسال
        run: pip -q install matplotlib requests

      # ورودی dispatch هرگز از مسیر ${{ }} وارد env نمی‌شود — گیت‌هاب مقدار env
      # را در لاگ عمومی چاپ می‌کند و یک بار توکن همین‌طور افشا شد (لاگ‌ها پاک
      # شدند). خواندن از فایل رویداد + add-mask یعنی مقدار نه در متن اسکریپت
      # ظاهر می‌شود نه در بلوک env، و هر جا سهواً چاپ شود ستاره می‌خورد.
      - name: ماسک کردن ورودی‌ها
        run: |
          for f in token chat_id; do
            v=$(jq -r ".inputs.$f // empty" "$GITHUB_EVENT_PATH")
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          true

      - name: ارسال سیگنال‌های تازه
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          # با ثبت Secrets، فرستندهٔ لحظه‌ای فعال است؛ پل دیگر فقط پیام تکراری
          # می‌سازد (دو دفترچهٔ جدا) — حمید سه تکرار دید. پس خودش کنار می‌کشد.
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "مسیر لحظه‌ای با Secrets فعال است — پل برای جلوگیری از تکرار کاری نمی‌کند"
            exit 0
          fi
          export TELEGRAM_BOT_TOKEN="$(jq -r '.inputs.token // empty' "$GITHUB_EVENT_PATH")"
          export TELEGRAM_CHAT_ID="$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")"
          python3 claude-liam-signal/python/tg_batch.py

      - name: ثبت دفترچهٔ ضدتکرار و سیگنال نهایی
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add brain/telegram-sent.json signals/telegram-log.json 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "تلگرام: دفترچهٔ ارسال $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git pull --rebase origin main || true
              sleep $((i*3))
            done
          fi

      - name: سیگنال نهایی روی پنل (gh-pages)
        run: |
          git fetch origin gh-pages -q || exit 0
          rm -rf /tmp/ghp
          git worktree add /tmp/ghp origin/gh-pages --detach -q || exit 0
          mkdir -p /tmp/ghp/signals
          cp signals/telegram-log.json /tmp/ghp/signals/ 2>/dev/null || true
          cd /tmp/ghp
          git add signals
          if ! git diff --cached --quiet; then
            git commit -q -m "سیگنال نهایی $(date -u '+%H:%M') UTC"
            for i in 1 2 3; do
              git push origin HEAD:gh-pages -q && break
              git fetch origin gh-pages -q || true
              git rebase origin/gh-pages -q || { git rebase --abort; break; }
            done
          fi
