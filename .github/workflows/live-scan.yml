# Runs the engine over the newest real candles and publishes what it says.
#
# The panel does this itself in the browser whenever it can reach the exchange.
# Where it cannot — Binance blocks Iran outright — it has no candles and refuses
# to invent a signal, which is correct and stays that way. But an unreachable
# exchange is a network fact, not a market fact: the setups exist either way.
# So the same engine runs here, where the network reaches, and the panel reads
# the result and shows it labelled as relayed.
#
# Nothing is decided differently. Same engine lifted out of index.html, same
# gates, same thresholds. The only added judgement is the ordering, which
# follows the real-candle backtest: 5m measured an edge, 15m did not.
name: Live scan

# The cron was "*/10 * * * *" and GitHub never ran it — 63 minutes on the
# default branch, six missed windows, zero scheduled runs while the two
# lower-frequency workflows in this repo fired normally. Every `*/N` schedule in
# the world fires on the same instants, so those windows are the most contended
# ones there are, and a free account's job is what gets dropped.
#
# Two specific minutes, deliberately odd, avoid that pile-up. Half-hourly is
# also honest about what a shared runner will actually deliver, and it costs
# little now: the panel fetches its own candles direct from the exchange, so
# this relay is the fallback for when nothing is open rather than the only way
# data arrives.
on:
  schedule:
    - cron: "7,37 * * * *"
  # راه‌انداز «push» عمداً برداشته شد.
  #
  # هر کامیت، سه‌چهار ورک‌فلوی سنگین را با هم روشن می‌کرد. آن‌ها همدیگر را کنسل
  # می‌کردند و — مهم‌تر — زمان‌بند گیت‌هاب روی مخزنی که این‌قدر شلوغ باشد اجراهای
  # کرون را می‌اندازد. اندازه‌گیری شد: بین ۲۳:۳۷ تا ۰۲:۰۶ هیچ اجرای زمان‌بندی‌شده‌ای
  # انجام نشد، در حالی که همان ورک‌فلو قبلش ساعتی یک بار می‌آمد.
  #
  # وقتی لازم بود که کارها روی شاخه بودند و کرون از شاخهٔ غیر‌اصلی شلیک نمی‌کند.
  # حالا همه روی main هستند. برای اجرای دستی، workflow_dispatch هست.
  workflow_dispatch:
    inputs:
      symbols:
        description: "How many of the most-traded pairs (48h) to scan"
        default: "100"

permissions:
  contents: write
  actions: write        # to dispatch the Pages rebuild

concurrency:
  group: live-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # main, not the working branch: the scan is normal operation and its
          # output belongs on the trunk. Publishing to a side branch left main's
          # signals/ and brain/ 49 minutes behind what the panel was serving,
          # which is the kind of drift that makes a repository lie about itself.
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: اگر زنجیره تازه است، کار تکراری نکن
        id: fresh
        run: |
          AGE=$(python3 - <<'PY'
          import json, time
          try:
              j = json.load(open("signals/latest.json"))
              print(int((time.time()*1000 - (j.get("generated") or 0)) / 60000))
          except Exception:
              print(999)
          PY
          )
          echo "عمر خروجی: ${AGE} دقیقه"
          if [ "$AGE" -lt 12 ]; then
            echo "زنجیرهٔ اصلی زنده است — این تور ایمنی کنار می‌کشد"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.fresh.outputs.skip != '1'
        name: Charting dependency
        run: pip install --quiet matplotlib

      # Delivery is skipped, loudly, when the secrets are absent — the scan still
      # runs and still publishes to the panel. Add TELEGRAM_BOT_TOKEN and
      # TELEGRAM_CHAT_ID under Settings → Secrets → Actions to switch it on.
      - if: steps.fresh.outputs.skip != '1'
        name: Scan and deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python3 claude-liam-signal/python/scan.py \
            --symbols "${{ github.event.inputs.symbols || '100' }}" \
            --telegram \
            | tee scan-output.txt

      - name: Summary
        if: always()
        run: |
          { echo '```'; tail -n 40 scan-output.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      # Only a run that came from main writes to main. Pushing a change to the
      # working branch triggers this workflow, and without this guard that run
      # would check out main, scan, and commit to main — so a branch push
      # silently moved the trunk, which is what made PR #3 conflict with itself.
      # Its own step because more than one later step commits, and tying the
      # identity to one of them meant a skipped step left the next one unable to
      # commit at all. That is exactly how this broke.
      - if: steps.fresh.outputs.skip != '1'
        name: Git identity
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Publish to main
        if: steps.fresh.outputs.skip != '1' && github.ref == 'refs/heads/main'
        env:
          BRANCH: main
        run: |
          # brain/ as well as signals/: the scan writes the events room and each
          # room's state too. Staging only signals/ left those modifications
          # unstaged, and `git rebase` refuses to run with a dirty tree — which
          # is exactly how the retry died instead of retrying.
          git add signals brain
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -q -m "Live scan $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Another run can land while this one works. Rebasing generated files
          # conflicts for no good reason, so this merges instead: .gitattributes
          # union-merges the append-only logs, and for the whole-file room state
          # the copy this run just produced is the fresher one and wins.
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$BRANCH" && exit 0
            git fetch origin "$BRANCH" || true
            if ! git merge --no-edit "origin/$BRANCH"; then
              # Resolve every generated path, not just rooms: staging brain/
              # wholesale after a partial resolution once committed a file with
              # its conflict markers still in it, which left the recall index
              # unparseable and silently disabled learning.
              git checkout --ours -- brain signals 2>/dev/null || true
              git add -A brain signals 2>/dev/null || git add -A brain || true
              git commit --no-edit || { git merge --abort; exit 1; }
            fi
            # Never publish a file carrying conflict markers.
            if git grep -qE "^(<<<<<<< |>>>>>>> )" -- brain signals; then
              echo "refusing to push: conflict markers survived the merge"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1

      # The panel is served from gh-pages, and it fetches ./signals/latest.json
      # relative to itself, so the file has to be there too or the relay reads
      # a 404 and the panel stays blind for no reason.
      - name: Publish to the deployed panel
        if: steps.fresh.outputs.skip != '1' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages --detach
          mkdir -p /tmp/ghp/signals
          cp signals/latest.json /tmp/ghp/signals/latest.json
          cd /tmp/ghp
          git add signals
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -q -m "Live scan $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:gh-pages" && exit 0
            git fetch origin gh-pages || true
            git rebase origin/gh-pages || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1

      # Pages rebuilds on a six-hour cron, which would leave the deployed panel
      # serving a scan hours old. `deploy-pages` refuses to run from anything but
      # the default branch, so the fix is to dispatch it there rather than to add
      # a push trigger here.
      - name: Rebuild the published panel
        if: steps.fresh.outputs.skip != '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}' && echo "pages rebuild requested"
