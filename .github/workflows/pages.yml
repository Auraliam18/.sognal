# Publishes the panel to GitHub Pages from the default branch, taking the
# content from gh-pages. `configure-pages` with enablement turns Pages on
# through the API, so this needs no click in repository settings.
name: Deploy panel to Pages

on:
  push:
    branches: [main]
    paths: ['terminal/**', 'scripts/build_terminal.py', 'runtime/contracts/panel_health.schema.json', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    # هر ۳۰ دقیقه، نه هر ۶ ساعت — با کرون ۶ساعته، پوش‌های تازهٔ gh-pages تا
    # ۶ ساعت به سایت نمی‌رسیدند و پنل «یخ‌زده» دیده می‌شد (دیده‌بان هم همین
    # را گرفت: ۵۴ دقیقه عقب). چرخه و رادار بعد از هر انتشار هم dispatch
    # می‌زنند؛ این کرون فقط تور ایمنی است.
    - cron: "13,43 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and publish the read-only terminal
        shell: bash
        run: |
          set -euo pipefail
          pip install PyYAML==6.0.3 jsonschema==4.26.0
          python source/scripts/validate_skill_package.py --repo-root source
          python -m unittest discover -s source/scripts -p test_terminal.py -v
          mkdir -p site/terminal
          cp source/terminal/index.html source/terminal/styles.css source/terminal/app.mjs source/terminal/lib.mjs site/terminal/
          cp source/terminal/sw.js site/terminal/sw.js
          cp source/lightweight-charts.js site/lightweight-charts.js
          python source/scripts/build_terminal.py --root source --output site/terminal/data
          test -s site/terminal/data/snapshot.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
