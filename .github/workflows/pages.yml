# Publishes the panel to GitHub Pages from the default branch, taking the
# content from gh-pages. `configure-pages` with enablement turns Pages on
# through the API, so this needs no click in repository settings.
name: Deploy panel to Pages

on:
  workflow_dispatch:
  schedule:
    # هر ۳۰ دقیقه، نه هر ۶ ساعت — با کرون ۶ساعته، پوش‌های تازهٔ gh-pages تا
    # ۶ ساعت به سایت نمی‌رسیدند و پنل «یخ‌زده» دیده می‌شد (دیده‌بان هم همین
    # را گرفت: ۵۴ دقیقه عقب). چرخه و رادار بعد از هر انتشار هم dispatch
    # می‌زنند؛ این کرون فقط تور ایمنی است.
    - cron: "13,43 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
