name: حمید — آنالیز ساعتی بازار

on:
  schedule:
    # هر ساعت در دقیقه ۱۷ — حتی وقتی خوابی
    - cron: '17 * * * *'
  workflow_dispatch:
    # اجرای دستی از GitHub Actions tab

permissions:
  contents: write

jobs:
  hamid-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hamid Analysis Agent
        run: python3 analysis/hamid_agent.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit & push findings
        run: |
          git config user.name  "Hamid Agent 🤖"
          git config user.email "hamid-agent@signal-futures.ai"

          if git diff --quiet analysis/hamid-log.json 2>/dev/null || \
             [ ! -f analysis/hamid-log.json ]; then
            echo "No changes to commit."
            exit 0
          fi

          SIGNALS=$(python3 -c "
          import json, sys
          try:
            data = json.load(open('analysis/hamid-log.json'))
            entry = data[0] if data else {}
            sigs = entry.get('signals', [])
            if sigs:
              print(' | '.join(f\"{s['symbol']} {s['direction']} {s['score']}\" for s in sigs[:3]))
            else:
              print('no signals')
          except: print('—')
          " 2>/dev/null || echo "—")

          git add analysis/hamid-log.json
          git commit -m "🤖 حمید $(date -u +'%H:%M UTC') — $SIGNALS"
          git push origin gh-pages
